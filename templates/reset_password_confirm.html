<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunes Host | Confirm Password Reset</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/Luneslogo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inter.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #020617;
            color: #f8fafc;
            font-family: Inter var,ui-sans-serif,system-ui,sans-serif,Apple Color Emoji,Segoe UI Emoji,Segoe UI Symbol,Noto Color Emoji;
        }
        .reset-shell {
            min-height: calc(100vh - 4rem);
            display: grid;
            place-items: center;
            padding: 2rem 1rem;
        }
        .reset-panel {
            width: min(100%, 28rem);
            padding: clamp(1.5rem, 5vw, 2.5rem);
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 0.125rem;
            background: rgba(15, 23, 42, 0.92);
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.4);
        }
        .reset-input {
            width: 100%;
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: 0.125rem;
            background: rgba(15, 23, 42, 0.8);
            color: #f8fafc;
        }
        .reset-input:focus {
            outline: none;
            border-color: rgba(96, 165, 250, 0.85);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .reset-button {
            min-height: 2.75rem;
            border: 1px solid rgba(147, 197, 253, 0.35);
            border-radius: 0.125rem;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: #f8fafc;
            font-weight: 600;
            transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
        }
        .reset-button:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.28);
        }
        .reset-button:focus-visible {
            outline: 2px solid #93c5fd;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    {% include 'partials/top_nav.html' %}
    <div class="reset-shell">
        <div class="reset-panel">
            {% include 'partials/flash_messages.html' %}

            <header class="mb-6">
                <p class="text-sm uppercase tracking-wider text-blue-300/80">Account</p>
                <h1 class="mt-1 text-2xl font-semibold">Confirm Password Reset</h1>
                <p class="mt-2 text-sm text-slate-400">Enter your new password to reset your account.</p>
            </header>
            <form method="post" action="{{ url_for('user.reset_password_confirm', token=token) }}">
                <!-- Include the token as a hidden field -->
                <input type="hidden" name="token" value="{{ token }}">

                <div class="mb-4">
                    <label for="email" class="mb-2 block text-sm font-medium text-slate-300">Email</label>
                    <input type="email" placeholder="yourEmail@gmail.com" name="email" id="email" class="reset-input px-3 py-2" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="mb-2 block text-sm font-medium text-slate-300">New Password</label>
                    <input type="password" name="password" id="password" class="reset-input px-3 py-2" required>
                </div>

                <div class="mb-6">
                    <label for="confirm_password" class="mb-2 block text-sm font-medium text-slate-300">Confirm New Password</label>
                    <input type="password" name="confirm_password" id="confirm_password" class="reset-input px-3 py-2" required>
                </div>

                <div>
                    <button type="submit" class="reset-button w-full px-4 py-2 text-sm sm:text-base">Reset Password</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
