<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunes Host | Password Reset</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/Luneslogo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inter.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?compat=recaptcha" async defer></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #020617;
            color: #f8fafc;
            font-family: Inter var,ui-sans-serif,system-ui,sans-serif,Apple Color Emoji,Segoe UI Emoji,Segoe UI Symbol,Noto Color Emoji;
        }
        .reset-shell {
            min-height: calc(100vh - 4rem);
            display: grid;
            place-items: center;
            padding: 2rem 1rem;
        }
        .reset-panel {
            width: min(100%, 28rem);
            padding: clamp(1.5rem, 5vw, 2.5rem);
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 0.125rem;
            background: rgba(15, 23, 42, 0.92);
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.4);
        }
        .reset-input {
            width: 100%;
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: 0.125rem;
            background: rgba(15, 23, 42, 0.8);
            color: #f8fafc;
        }
        .reset-input:focus {
            outline: none;
            border-color: rgba(96, 165, 250, 0.85);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .reset-button {
            min-height: 2.75rem;
            border: 1px solid rgba(147, 197, 253, 0.35);
            border-radius: 0.125rem;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: #f8fafc;
            font-weight: 600;
            transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
        }
        .reset-button:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.28);
        }
        .reset-button:focus-visible {
            outline: 2px solid #93c5fd;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    {% include 'partials/top_nav.html' %}
    <div class="reset-shell">
        <div class="reset-panel">
            {% include 'partials/flash_messages.html' %}
            <header class="mb-6">
                <p class="text-sm uppercase tracking-wider text-blue-300/80">Account</p>
                <h1 class="mt-1 text-2xl font-semibold">Reset Password</h1>
                <p class="mt-2 text-sm text-slate-400">Enter your email to reset your password.</p>
            </header>
            <form method="post" action="{{ url_for('user.reset_password') }}">
                <div class="mb-4">
                    <label class="mb-2 block text-sm font-medium text-slate-300" for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="myemail@gmail.com" class="reset-input px-3 py-2" required />
                </div>
                <div class="g-recaptcha mb-6" data-sitekey="{{ RECAPTCHA_PUBLIC_KEY }}"></div>
                <div>
                    <button type="submit" class="reset-button w-full px-4 py-2">Reset Password</button>
                </div>
            </form>
            <a href="{{ url_for('user.login_user') }}" class="mt-5 inline-block text-sm text-blue-300 hover:text-blue-200 hover:underline">Back to login</a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var flashMessages = document.getElementById("flash-messages");
            if (flashMessages) {
                setTimeout(function() {
                    flashMessages.style.display = "none";
                }, 5000);
            }
        });
    </script>
</body>
</html>
